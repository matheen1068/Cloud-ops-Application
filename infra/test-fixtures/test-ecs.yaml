AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloud-Ops test fixture: a Fargate service (nginx) with an auto scaling range of 0-2,
  starting at 0 tasks so it costs nothing until you scale it. Delete the stack when done.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets (tasks get a public IP to pull the image)

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cloudops-test

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cloud-Ops test tasks (outbound only)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Pull the image from ECR Public

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cloudops-test-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: web
          Image: public.ecr.aws/nginx/nginx:stable-alpine
          Essential: true

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      Tags:
        - Key: CloudOpsManaged
          Value: "true"

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: 0
      MaxCapacity: 2

Outputs:
  Cluster:
    Value: !Ref Cluster
  Service:
    Value: !GetAtt Service.Name
