AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloud-Ops access role. Lets the Cloud-Ops platform discover and scale
  Auto Scaling groups in this account. Deploy as a single stack (one account)
  or as a service-managed StackSet from the Organization management account
  (all child accounts in the chosen OUs, auto-deployed to new accounts).

# How onboarding uses this template
# - Single account: the app shows a CloudFormation quick-create link with
#   PlatformAccountId and ExternalId pre-filled; the user clicks Create and
#   pastes the RoleArn output back into the app.
# - Organization: the user deploys this as a StackSet (service-managed
#   permissions) to their OUs. Service-managed StackSets skip the management
#   account itself, so deploy one normal stack there with
#   IsOrgManagementAccount=true so the app can list the child accounts.
# - Every account ends up with the same role name, so the app treats both
#   paths identically.

Parameters:
  PlatformAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: AWS account ID where the Cloud-Ops platform runs.
  PlatformRoleName:
    Type: String
    Default: CloudOpsPlatformRole
    Description: Role in the platform account that is allowed to assume this role.
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 128
    NoEcho: true
    Description: Unique per tenant, generated by the Cloud-Ops app. Prevents confused-deputy access.
  RoleName:
    Type: String
    Default: CloudOpsAccessRole
    Description: Keep the same name in every account.
  AccessLevel:
    Type: String
    Default: Operate
    AllowedValues: [ReadOnly, Operate]
    Description: ReadOnly = inventory and metrics only. Operate = can also change capacity and schedules.
  RestrictToTaggedASGs:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: If true, scaling is allowed only on ASGs tagged CloudOpsManaged=true.
  IsOrgManagementAccount:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set true only in the Organization management account, to allow listing child accounts.

Conditions:
  CanOperate: !Equals [!Ref AccessLevel, Operate]
  CanOperateAnyASG: !And
    - !Condition CanOperate
    - !Equals [!Ref RestrictToTaggedASGs, "false"]
  CanOperateTaggedASGs: !And
    - !Condition CanOperate
    - !Equals [!Ref RestrictToTaggedASGs, "true"]
  IsMgmt: !Equals [!Ref IsOrgManagementAccount, "true"]

Resources:
  CloudOpsAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Assumed by the Cloud-Ops platform to discover and scale Auto Scaling groups.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudOpsPlatform
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${PlatformAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
              ArnEquals:
                aws:PrincipalArn: !Sub "arn:${AWS::Partition}:iam::${PlatformAccountId}:role/${PlatformRoleName}"
      Policies:
        - PolicyName: CloudOpsRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InventoryAndMetrics
                Effect: Allow
                Action:
                  - autoscaling:Describe*
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeSpotPriceHistory
                  - ec2:GetInstanceTypesFromInstanceRequirements
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - servicequotas:ListServiceQuotas
                Resource: "*"
              - Sid: ReadAlarms
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:*"
              # Only EC2 quotas are needed (vCPU limits before a big scale-up).
              - Sid: ReadEc2Quotas
                Effect: Allow
                Action: servicequotas:GetServiceQuota
                Resource: !Sub "arn:${AWS::Partition}:servicequotas:*:${AWS::AccountId}:ec2/*"
      Tags:
        - Key: ManagedBy
          Value: Cloud-Ops

  # Capacity and schedule changes only. Changing launch templates or mixed
  # instances settings later will also need ec2:RunInstances / iam:PassRole.
  ScaleAnyASGPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: CanOperateAnyASG
    Properties:
      RoleName: !Ref CloudOpsAccessRole
      PolicyName: CloudOpsScale
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ScaleAutoScalingGroups
            Effect: Allow
            Action:
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
              - autoscaling:PutScheduledUpdateGroupAction
              - autoscaling:BatchPutScheduledUpdateGroupAction
              - autoscaling:DeleteScheduledAction
              - autoscaling:BatchDeleteScheduledAction
              - autoscaling:SuspendProcesses
              - autoscaling:ResumeProcesses
            Resource: !Sub "arn:${AWS::Partition}:autoscaling:*:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/*"

  ScaleTaggedASGPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: CanOperateTaggedASGs
    Properties:
      RoleName: !Ref CloudOpsAccessRole
      PolicyName: CloudOpsScaleTagged
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ScaleTaggedAutoScalingGroups
            Effect: Allow
            Action:
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
              - autoscaling:PutScheduledUpdateGroupAction
              - autoscaling:BatchPutScheduledUpdateGroupAction
              - autoscaling:DeleteScheduledAction
              - autoscaling:BatchDeleteScheduledAction
              - autoscaling:SuspendProcesses
              - autoscaling:ResumeProcesses
            Resource: !Sub "arn:${AWS::Partition}:autoscaling:*:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/*"
            Condition:
              StringEquals:
                aws:ResourceTag/CloudOpsManaged: "true"

  OrgDiscoveryPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: IsMgmt
    Properties:
      RoleName: !Ref CloudOpsAccessRole
      PolicyName: CloudOpsOrgDiscovery
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeOrganization
            Effect: Allow
            Action:
              - organizations:DescribeOrganization
              - organizations:ListAccounts
              - organizations:ListRoots
            Resource: "*"
          # Walking the OU tree: scoped to this organization's root and OUs.
          - Sid: WalkOrganizationTree
            Effect: Allow
            Action:
              - organizations:ListOrganizationalUnitsForParent
              - organizations:ListAccountsForParent
            Resource:
              - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:root/o-*/r-*"
              - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*"

Outputs:
  RoleArn:
    Description: Paste this into the Cloud-Ops app to finish connecting the account.
    Value: !GetAtt CloudOpsAccessRole.Arn
  AccessLevel:
    Value: !Ref AccessLevel
